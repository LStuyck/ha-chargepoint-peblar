name: Feature request
description: Suggest a new sensor, entity, service, or behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the use case. "I'd like to ..." or "It would help if ..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: How would you imagine this working in HA?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.
  - type: textarea
    id: api_reference
    attributes:
      label: API reference
      description: |
        If the feature requires data from the charger that the integration
        doesn't already expose, link to the relevant Peblar OpenAPI endpoint
        or paste the response shape.
